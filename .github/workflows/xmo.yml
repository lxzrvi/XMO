name: XMO
run-name: XMO

on:
  workflow_dispatch:

jobs:
  build:
    name: XMO Kitchen
    runs-on: ubuntu-latest

    steps:
      - name: Getting XMO
        uses: actions/checkout@v4

      - name: Java is running
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android kitchen is ready
        uses: android-actions/setup-android@v4

      - name: Update Android SDK
        run: |
          sdkmanager --update

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android API 37
        run: |
          sdkmanager --channel=3 "platforms;android-37"

      - name: Verify Android API 37
        run: |
          sdkmanager --list --channel=3 | grep -E "platforms;android-37" || true
          ls -la "$ANDROID_SDK_ROOT/platforms"

      - name: Adding ingredients
        uses: gradle/actions/setup-gradle@v4

      - name: APK is cooking
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --configuration-cache

      - name: Ready to serve
        uses: actions/upload-artifact@v4
        with:
          name: XMO
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
          if-no-files-found: error
