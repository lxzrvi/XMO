name: XMO Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest

    steps:
      - name: Getting XMO
        uses: actions/checkout@v4

      - name: Making icons
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable

          icon() {
            cat > "app/src/main/res/drawable/ic_xmo_$1.xml" <<EOF
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="$2"/>
          </vector>
          EOF
          }

          icon all "M3,3h8v8h-8zM13,3h8v8h-8zM3,13h8v8h-8zM13,13h8v8h-8z"
          icon songs "M12,3v11.2A4,4 0,1 0,14 17V7h5V3z"
          icon album "M12,2A10,10 0,1 0,12 22A10,10 0,1 0,12 2M12,9A3,3 0,1 1,12 15A3,3 0,1 1,12 9"
          icon heart "M12,21s-9-5.4-9-12a5,5 0,0 1,9-3a5,5 0,0 1,9 3c0,6.6-9,12-9,12"
          icon artist "M12,12a4,4 0,1 0,0-8a4,4 0,1 0,0 8M4,21c0-4.4,3.6-7,8-7s8,2.6,8,7z"
          icon add "M11,5h2v6h6v2h-6v6h-2v-6h-6v-2h6z"
          icon history "M13,3a9,9 0,1 1-8.5,6H2l3.5-4L9,9H6.6A7,7 0,1 0,13 5zM12,7h2v5l4,2l-1,1.7l-5-2.7z"
          icon arrow "M9,5l7,7l-7,7z"
          icon more "M12,5a2,2 0,1 0,0 .01M12,10a2,2 0,1 0,0 .01M12,15a2,2 0,1 0,0 .01"
          icon refresh "M17.6,6.4A8,8 0,0 0,4.3 9H2l3.5,3.5L9,9H6.4A6,6 0,1 1,6 15h-2a8,8 0,1 0,1-8.7L3,5h6v6z"
          icon menu "M3,6h18v2H3zM3,11h18v2H3zM3,16h18v2H3z"
          icon star "M12,2l3,6l6.6,1l-4.8,4.7l1.1,6.6L12,17.2l-5.9,3.1l1.1-6.6L2.4,9L9,8z"
          icon spark "M12,2l1.7,6.3L20,10l-6.3,1.7L12,18l-1.7-6.3L4,10l6.3-1.7z"
          icon diamond "M7,3h10l5,6l-10,12L2,9z"
          icon bolt "M13,2L5,14h6l-1,8l9-13h-6z"

      - name: Saving icons
        run: |
          git config user.name "XMO"
          git config user.email "actions@github.com"
          git add app/src/main/res/drawable/
          git commit -m "Add XMO icons"
          git push
